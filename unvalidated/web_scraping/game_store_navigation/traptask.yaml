dirs:
  inputs: inputs/
  expected: expected/

cases:
- id: case_01
  description: "Simplest instance of the token-gated-API pattern -- catalog is rendered entirely by JS from games.json, which the server rejects without the per-run token a real page load injects. No bundle/pagination/filter reasoning needed beyond that."
  tags: [web_scraping, token_gated_api, baseline]

- id: case_02
  description: "Flash-sale base price + discount live only in a token-gated JSON endpoint; raw HTML shows 'computing…' and carries no data attributes to read instead."
  tags: [web_scraping, js_computed, token_gated_api]

- id: case_03
  description: "Discount percentage exists only as pixels in a promo banner PNG; base price is in page text. Requires combining text extraction with image reading (OCR/vision) -- the one mechanism a token alone can't protect, since it was never a fetchable data file to begin with."
  tags: [web_scraping, image_text_combined, requires_vision]

- id: case_04
  description: "Tiered bundle: each tier's price and game list come from a token-gated endpoint, only fetched on click; per-game value is non-monotonic across tiers (a naive 'pick the biggest tier' heuristic gets this wrong)."
  tags: [web_scraping, bundle_tier_value, token_gated_api, requires_interaction]

- id: case_05
  description: "Same tiered-bundle mechanism as case_04, asking for a marginal (tier-to-tier) price difference instead of an absolute value."
  tags: [web_scraping, bundle_tier_marginal, token_gated_api, requires_interaction]

- id: case_06
  description: "Two bundles share a near-identical name (Constellation Collection vs. ...: Director's Cut), each backed by its own token-gated endpoint; the question requires picking the correct one."
  tags: [web_scraping, bundle_disambiguation, token_gated_api, requires_interaction]

- id: case_07
  description: "Derived reasoning across a base game + its DLC (on the game's detail page) vs. a separately-listed bundled edition. Deliberately NOT token-gated -- these are ordinary storefront prices any visitor sees, same as a real product page; the discriminator here is correct cross-referencing/arithmetic, not scraping architecture."
  tags: [web_scraping, dlc_vs_edition, derived_metric]

- id: case_08
  description: "Requires applying a category filter, a rating filter, and a price sort together (client-side, no page reload) against a token-gated catalog endpoint to find the answer."
  tags: [web_scraping, filter_sort, token_gated_api, requires_interaction]

- id: case_09
  description: "Catalog is paginated (6 games/page, 19 total, 4 pages) against a token-gated endpoint -- answer requires paging through every page, not just reading the first render."
  tags: [web_scraping, pagination_count, token_gated_api, requires_interaction]

- id: case_10
  description: "Store-wide region selector changes displayed currency/price via a token-gated regions.json + localStorage persistence across pages -- the conversion rates themselves aren't in any plainly-readable JS source."
  tags: [web_scraping, region_pricing, token_gated_api, requires_interaction]

judge:
  cmd: python3 judge.py

grader:
  cmd: python3 grader.py
