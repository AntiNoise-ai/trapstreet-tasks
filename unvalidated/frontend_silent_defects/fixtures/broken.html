<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing</title>
<style>
  /* Looks finished in a screenshot. Four things are wrong and none of them show. */
  * { box-sizing:border-box }
  body { margin:0; font:16px/1.6 system-ui, sans-serif; color:#14181f; background:#fff }
  main { max-width:960px; margin:0 auto; padding:32px 20px }
  h1 { font-size:32px; margin:0 0 8px }
  p.lede { color:#b6bcc4; margin:0 0 24px }            /* 1. 2.0:1 on white */
  .toggle { display:inline-flex; gap:4px; border:1px solid #d6dce3; border-radius:6px; padding:3px; margin-bottom:28px }
  .toggle div { color:#8d959e; padding:6px 14px; border-radius:4px; cursor:pointer }
  .toggle div.on { background:#1d4ed8; color:#fff }
  .tiers { display:grid; grid-template-columns:repeat(3, 260px); gap:16px }  /* 2. never collapses */
  .tier { border:1px solid #d6dce3; border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:8px }
  .tier h2 { font-size:18px; margin:0; white-space:nowrap; overflow:hidden }  /* 3. clips long names */
  .tier .price { font-size:28px; font-weight:700 }
  .tier ul { margin:0; padding-left:18px; color:#b6bcc4; font-size:14px }
  .tier a.cta { margin-top:auto; display:block; text-align:center; background:#1d4ed8; color:#fff; text-decoration:none; padding:9px; border-radius:6px }
  form { margin-top:32px; display:flex; gap:8px; align-items:end }
  input { font:inherit; padding:8px; border:1px solid #d6dce3; border-radius:6px }
</style>
</head>
<body>
<main>
  <h1>Pricing</h1>
  <p class="lede">Plans for teams of every size.</p>

  <div class="toggle">
    <div class="on">Monthly</div>
    <div data-testid="billing-toggle">Annual</div>   <!-- 4. no handler, not a button -->
  </div>

  <section class="tiers" id="tiers"></section>

  <form>
    <input type="email" data-testid="email" placeholder="you@company.com">
    <div class="cta" style="background:#1d4ed8;color:#fff;padding:9px 16px;border-radius:6px">Contact sales</div>
  </form>
</main>

<script>
  const DEFAULT = [
    { name: "Starter",    monthly: 12,  features: ["1 project", "Community support"] },
    { name: "Team",       monthly: 40,  features: ["10 projects", "Email support"] },
    { name: "Enterprise", monthly: 120, features: ["Unlimited", "SLA"] },
  ];
  const data = Array.isArray(window.__DATA__) ? window.__DATA__ : DEFAULT;

  document.getElementById("tiers").innerHTML = data.map(t => `
    <article class="tier" data-testid="tier">
      <h2>${t.name}</h2>
      <div class="price" data-testid="price">$${t.monthly}<span style="font-size:14px;font-weight:400;color:#b6bcc4">/mo</span></div>
      <ul>${(t.features || []).map(f => `<li>${f}</li>`).join("")}</ul>
      <a class="cta" href="#buy">Choose ${t.name}</a>
    </article>`).join("");
</script>
</body>
</html>
