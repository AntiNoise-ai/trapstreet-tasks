  description: "The tenant is 22 months into a 36-month fixed term and wants to surrender immediately. The Landlord agrees and finds a replacement tenant 1 month later, at the rent the agreement specifies for each remaining month. Per Section 6, calculate the total cost to the surrendering tenant: (a) rent for the 1-month gap, (b) letting fee 13.2% on the replacement's rent for the remainder of the fixed term, (c) inventory check-in proportional to months surrendered early (£144 × months_early / 36), (d) administration charges proportional to months surrendered early (£480 × months_early / 36). Show the calculation and give the final GBP total."
  tags:
  - scenario
  - hard
