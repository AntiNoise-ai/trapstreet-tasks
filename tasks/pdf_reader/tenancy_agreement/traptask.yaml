  description: "The tenant is 22 months into a 36-month fixed term and wants to surrender the tenancy immediately. Using the rent schedule in the agreement, calculate the approximate total rent liability if the Landlord agrees to early surrender but NO replacement Tenant is found. Show the calculation by rent period and give the final GBP total."
  tags:
  - scenario
  - hard
- id: early_surrender_economic_incentive
  description: "Based on the agreement, could early surrender potentially cost the tenant more than simply continuing to pay rent until the end of the fixed term? Answer yes or no and explain briefly."
