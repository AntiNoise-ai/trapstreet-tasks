dirs:
  inputs: inputs/
  expected: expected/

# Case ids are opaque on purpose — the solution can read its own
# TRAP_MANIFEST["inputs_dir"], so a descriptive id leaks the topic. The real
# labels live in gold.cases.json and expected/<id>/answer.json.
# `description` here is a neutral summary for the task page; the actual
# prompt the solution sees is inputs/<id>/question.txt.
cases:
- id: case_01
  description: "Extract a tiered rent figure for a specific 12-month window"
  tags: [money, medium]
- id: case_02
  description: "Extract a tiered rent figure for a window that may fall outside the term"
  tags: [money, medium]
- id: case_03
  description: "Extract the deposit amount"
  tags: [money, easy]
- id: case_04
  description: "Extract the tenancy start date in a specified format"
  tags: [dates, easy]
- id: case_05
  description: "Extract the day of month rent falls due"
  tags: [money, medium]
- id: case_06
  description: "Decide whether a contractual break clause exists"
  tags: [clauses, medium]
- id: case_07
  description: "Decide whether discretionary early surrender is available"
  tags: [clauses, hard]
- id: case_08
  description: "Decide whether notice is required to leave at end of fixed term"
  tags: [clauses, hard]
- id: case_09
  description: "Describe the holdover consequence after the fixed term"
  tags: [clauses, hard]
- id: case_10
  description: "Determine which period a rent-increase clause applies to"
  tags: [money, hard]
- id: case_11
  description: "Identify the deposit protection scheme"
  tags: [clauses, medium]
- id: case_12
  description: "Determine the pets policy"
  tags: [clauses, medium]
- id: case_13
  description: "Compute total rent across the fixed term with tiered rates"
  tags: [money, hard]
- id: case_14
  description: "Quote the late-payment interest rate as written"
  tags: [money, hard]
- id: case_15
  description: "Identify the governing statute and the section cited"
  tags: [clauses, hard]
- id: case_16
  description: "Decide whether inventory is referenced for damage assessment"
  tags: [clauses, hard]
- id: case_17
  description: "Describe the deposit dispute escalation route"
  tags: [deposit, hard]
- id: case_18
  description: "Multi-step early-surrender cost calculation from clause terms"
  tags: [scenario, hard]
- id: case_19
  description: "Reason about who benefits when a replacement pays higher rent"
  tags: [scenario_reasoning, expert]

judge:
  cmd: python3 judge.py

grader:
  cmd: python3 grader.py
