dirs:
  inputs: inputs/
  expected: expected/

cases:
- id: case_01
  description: "Customer region migration effective a specific date; must fix live current-state AND one wrongly-baked historical invoice, leave the prior invoice untouched"
  tags: [debug_subscription_billing_pipeline, region_migration_dated]
- id: case_02
  description: "Plan price increase effective from a date; percentage discount must recalc off the new subtotal while a fixed discount does not, invoices before the date are untouched"
  tags: [debug_subscription_billing_pipeline, plan_price_change_dated]
- id: case_03
  description: "Add-on rename and reprice with NO backfill required; tests restraint against over-editing historical invoices that should not change"
  tags: [debug_subscription_billing_pipeline, addon_rename_reprice_no_backfill]
- id: case_04
  description: "Discount code percentage correction plus one specific historical invoice fix; a distractor invoice on a different code must not be touched"
  tags: [debug_subscription_billing_pipeline, discount_code_pct_correction]
- id: case_05
  description: "Subscription transfers to a NEW customer entity in a different region (insert + update + baked tax recompute), deepest hop chain"
  tags: [debug_subscription_billing_pipeline, subscription_transfer_new_customer_new_region]
- id: case_06
  description: "Compound ticket: tier upgrade and discount code applied simultaneously on one invoice without cross-contaminating the prior period"
  tags: [debug_subscription_billing_pipeline, compound_tier_upgrade_plus_discount]

judge:
  cmd: python3 judge.py

grader:
  cmd: python3 grader.py
