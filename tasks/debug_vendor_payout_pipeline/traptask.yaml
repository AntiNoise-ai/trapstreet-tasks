dirs:
  inputs: inputs/
  expected: expected/

cases:
- id: case_01
  description: "Re-book misattributed sales to correct vendor (all-time); must update lookup path + baked fields + baked payout"
  tags: [debug_vendor_payout_pipeline, supplier_change_alltime]
- id: case_02
  description: "Re-book misattributed sales to correct vendor from a specific date onwards (partial re-book)"
  tags: [debug_vendor_payout_pipeline, supplier_change_dated]
- id: case_03
  description: "SRP renegotiated to 2x current price; must recompute baked vendor payout to reflect new pricing"
  tags: [debug_vendor_payout_pipeline, srp_change_recalc_payout]
- id: case_04
  description: "Vendor payout terms renegotiated from pct to fixed $ per unit; must update retail baked + b2b terms"
  tags: [debug_vendor_payout_pipeline, payout_terms_change_with_b2b]

judge:
  cmd: python3 judge.py

grader:
  cmd: python3 grader.py
